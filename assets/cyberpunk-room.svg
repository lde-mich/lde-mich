<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk pixel developer room</title>
  <desc id="desc">A pixel-art cyberpunk room with a developer at a computer, neon lights, city rain, and gaming details.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050712"/>
      <stop offset="0.52" stop-color="#0A1022"/>
      <stop offset="1" stop-color="#13071F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="250" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1326"/>
      <stop offset="1" stop-color="#070A13"/>
    </linearGradient>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pinkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .screen { animation: pulse 2.6s ease-in-out infinite; }
      .pink { animation: pinkPulse 3s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(2, end) infinite; }
      .rain-a { animation: rain 1.8s linear infinite; }
      .rain-b { animation: rain 2.4s linear infinite; }
      .fan { transform-origin: 904px 252px; animation: spin 1.5s linear infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes pinkPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
      @keyframes rain {
        from { transform: translateY(-48px); }
        to { transform: translateY(82px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <rect width="1100" height="420" rx="18" fill="url(#sky)"/>
  <rect x="18" y="18" width="1064" height="384" rx="14" fill="#080B16" stroke="#24324A" stroke-width="2"/>
  <rect x="18" y="258" width="1064" height="144" rx="14" fill="url(#floor)"/>

